[project]
name = "ha-energy-hub"
version = "0.1.0"
description = "Home Assistant integration combining energy, cost and carbon data from any source"
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component>=0.13.373",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.energy_hub"]
